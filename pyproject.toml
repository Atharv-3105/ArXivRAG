[project]
name = "arxivmind"
version = "0.1.0"
description = "ArXivMind: agentic AI research companion"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
    "httpx",
    "anthropic",
    "tenacity",
    "pymupdf",
    "lxml",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "qdrant-client",
    "fastembed",  # dense (bge-small) + BM25 sparse embeddings on ONNX Runtime: no PyTorch
    "langgraph",
    "langsmith",  # optional tracing; inert unless LANGSMITH_TRACING=true
    "pyjwt",
    "jinja2",
    "prometheus-client",
    "bcrypt",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.uv]
# This is an application, not a distributable package: install deps only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real Postgres/Qdrant (docker compose up); deselect with -m 'not integration'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["env", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade
    "ASYNC", # blocking calls inside async functions
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: these defaults are markers, evaluated once, never mutated.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Fixtures embed HTML/LaTeX strings that are clearer unwrapped; fakes may do blocking file I/O.
"tests/**" = ["E501", "ASYNC230"]
# The demo corpus: paraphrased abstracts kept on one line each, like a data file.
"src/api/demo.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

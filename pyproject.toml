[project]
name = "arxivmind"
version = "0.1.0"
description = "ArXivMind: agentic AI research companion"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
    "httpx",
    "tenacity",
    "pymupdf",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "qdrant-client",
    "sentence-transformers",
    "torch",  # listed explicitly so [tool.uv.sources] below can pin the CPU-only build on Linux
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.uv]
# This is an application, not a distributable package: install deps only.
package = false

# Docker/CI run Linux: the default torch wheel there bundles multi-GB CUDA libs we don't use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real Postgres/Qdrant (docker compose up); deselect with -m 'not integration'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["env", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade
    "ASYNC", # blocking calls inside async functions
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

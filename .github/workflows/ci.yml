name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests, offline eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (unit only; integration needs live services)
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-use
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: uv run pytest -m "not integration"

      - name: Offline evaluation gate (thresholds in src/eval/data/thresholds.json)
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-use
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: uv run python -m src.eval.offline >> "$GITHUB_STEP_SUMMARY"

  web:
    name: frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build, smoke test, push
    runs-on: ubuntu-latest
    needs: [quality, web, secrets]
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t arxivmind:ci .

      - name: Report image size
        run: |
          echo "### Image size" >> "$GITHUB_STEP_SUMMARY"
          docker image ls arxivmind:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (app imports, templates validate, no torch in the image)
        run: |
          docker run --rm -e SECRET_KEY=smoke-test-secret-key-0123456789 \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost:5432/x arxivmind:ci \
            python -c "import importlib.util as u; assert u.find_spec('torch') is None; \
          from src.agents.prompts import validate_templates; validate_templates(); \
          import src.api.app; print('ok')"

      - name: Push to GHCR (main only; immutable sha tag + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag arxivmind:ci "$IMAGE:${{ github.sha }}"
          docker tag arxivmind:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

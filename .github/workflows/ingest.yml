name: Scheduled ingestion

# The free-tier "cron job": GitHub Actions runs the pipeline against the managed Postgres and
# Qdrant, so no always-on worker is needed. Idempotent (ADR 0002): a re-run only repairs.
on:
  schedule:
    - cron: "30 3 * * *" # daily, 03:30 UTC (arXiv announces new papers ~00:00 UTC)
  workflow_dispatch:
    inputs:
      max_papers:
        description: "papers to fetch"
        default: "25"

permissions:
  contents: read

concurrency:
  group: ingestion # never two runs at once
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Run pipeline
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          MODEL_CACHE_DIR: /tmp/models
        run: uv run python -m src.pipeline.runner --max-papers "${{ inputs.max_papers || '25' }}"
      - name: Repair anything left pending
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          MODEL_CACHE_DIR: /tmp/models
        run: uv run python -m src.pipeline.reindex
